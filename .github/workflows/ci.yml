name: build

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Extension (sm${{ matrix.sm_version }}, ${{ matrix.platform.os_short }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: windows-latest, os_short: win-latest }
          - { os: ubuntu-latest, os_short: steamrt3, image: "registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest" }
          - { os: ubuntu-latest, os_short: steamrt4, image: "registry.gitlab.steamos.cloud/steamrt/steamrt4/sdk:latest" }
        sm_version:
          - "1.12"
          - "latest"

        include:
          - sm_version: latest
            sm_branch: master

          - sm_version: "1.12"
            sm_branch: "1.12-dev"

    steps:
      - name: Prepare env
        shell: bash
        run: |
          echo "GITHUB_SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Getting SourceMod ${{ matrix.sm_version }}
        uses: actions/checkout@v7
        with:
          repository: alliedmodders/sourcemod
          ref: ${{ matrix.sm_branch }}
          path: sourcemod-${{ matrix.sm_version }}
          submodules: recursive

      - name: Getting ambuild
        if: runner.os == 'Windows'
        run: |
          python -m pip install wheel
          pip install git+https://github.com/alliedmodders/ambuild

      - name: Getting own repository
        uses: actions/checkout@v7
        with:
          path: extension
          submodules: recursive

      - name: Compiling ${{ github.event.repository.name }} files
        if: runner.os == 'Windows'
        working-directory: extension
        run: |
          mkdir build
          cd build
          python ../configure.py --enable-optimize --sm-path="${{ github.workspace }}/sourcemod-${{ matrix.sm_version }}" --targets=x86,x64
          ambuild

      - name: Compiling ${{ github.event.repository.name }} files (${{ matrix.platform.os_short }})
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work/extension \
            -e CC=clang \
            -e CXX=clang++ \
            ${{ matrix.platform.image }} \
            bash -ec '
              git clone --depth 1 https://github.com/alliedmodders/ambuild.git /tmp/ambuild
              (cd /tmp/ambuild && python3 setup.py install)
              mkdir build && cd build
              python3 ../configure.py --enable-optimize --sm-path=/work/sourcemod-${{ matrix.sm_version }} --targets=x86,x64
              ambuild
            '

      - name: Uploading package
        uses: actions/upload-artifact@v7
        with:
          name: sm-ext-json-sm${{ matrix.sm_version }}-${{ matrix.platform.os_short }}-${{ env.GITHUB_SHA_SHORT }}
          path: extension/build/package

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          path: extension
          sparse-checkout: |
            src/smsdk_config.h

      - name: Get version from smsdk_config.h
        id: get_version
        run: |
          VERSION=$(grep '#define SMEXT_CONF_VERSION' extension/src/smsdk_config.h | awk -F '"' '{print $2}')
          if [ -z "$VERSION" ]; then
            echo "Error: Could not find version in smsdk_config.h"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate Release Notes
        run: echo "${{ github.event.head_commit.message }}" >> release_notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release Archives
        run: |
          cd artifacts
          for dir in sm-ext-json-*; do
            7z a "../${dir}.zip" "./${dir}/"*
          done

      - name: Update Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          body_path: release_notes.md
          files: |
            sm-ext-json-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
